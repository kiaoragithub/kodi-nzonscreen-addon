name: Validate add-on

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python
        run: python -m py_compile addon.py service.py resources/lib/addon.py resources/lib/nzos.py scripts/build_release.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository files
        run: python tests/test_repository_files.py
      - name: Verify reproducible release
        run: |
          python scripts/build_release.py
          git diff --exit-code

name: Validate add-on

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m py_compile addon.py resources/lib/addon.py resources/lib/nzos.py
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Validate repository files
        run: python tests/test_repository_files.py
